# nixpacks.toml
# Railway configuration for the PromptCEO RENDER WORKER only.
#
# CRITICAL: This project is a Next.js app, but Railway must NOT run
# npm run build. The render worker is a standalone Node.js script
# that only needs dependencies installed, not the full Next.js build.
#
# The [phases.build] override with cmds=[] is what prevents Railway
# from auto-detecting Next.js and running npm run build.

[phases.setup]
nixPkgs = ["ffmpeg-full", "nodejs_20"]

[phases.install]
cmds = ["npm install"]

[phases.build]
cmds = []

[start]
cmd = "node scripts/render-worker.mjs"
